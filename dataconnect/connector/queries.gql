query GetTours @auth(level: PUBLIC) {
  tours {
    id
    title
    location
    duration
    durationHours
    durationDays
    originalPrice
    price
    discount
    rating
    reviewsCount
    category
    description
    shortDescription
    image
    featured
    oneDay
    popular
    status
    destination
    vibeAdrenaline
    vibeRelax
    vibeCulture
    vibeFamily
    lat
    lng
    heroImages
    heroBackgroundPosition
    translations
    operatorId
    availableDates
    itinerary
    minAge
    maxPassengers
    trailerUrl
    galleryImages
    mapCenterLat
    mapCenterLng
    mapZoom
    difficulty
    seasonality
    includes
    excludes
    requirements
    pickupInfo
    cancellationPolicy
    languages
    groupType
    createdAt
    updatedAt
  }
}

