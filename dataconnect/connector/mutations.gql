mutation AddOfflineCheckin(
  $tourId: UUID
  $bookingId: UUID
  $tourTitle: String
  $customerName: String
  $operator: String!
) @auth(level: USER) {
  pwaCheckin_insert(data: {
    tourId: $tourId
    bookingId: $bookingId
    tourTitle: $tourTitle
    customerName: $customerName
    operator: $operator
    status: PENDIENTE_SYNC
