}

# SECURITY: caller must ensure $userId === auth.uid. The client (dataService.addBooking)
# and the createBooking Cloud Function enforce this; never let a user book on behalf of another.
mutation CreateBooking(
  $bookingId: String!
  $tourId: UUID!
  $userId: String!
  $guests: Int!
  $date: Timestamp!
  $totalPrice: Float!
  $currency: String
  $status: BookingStatus
  $addons: Any
  $specialRequests: String
) @auth(level: USER) {
  booking_insert(data: {
    bookingId: $bookingId
    tourId: $tourId
    userId: $userId
    guests: $guests
    date: $date
    totalPrice: $totalPrice
    currency: $currency
    status: $status
    addons: $addons
    specialRequests: $specialRequests
  })
}

# SECURITY: caller must ensure $userId === auth.uid. See CreateBooking.
mutation UpdateBooking(
  $id: UUID!
  $tourId: UUID
  $userId: String
  $guests: Int
  $date: Timestamp
  $totalPrice: Float
  $currency: String
  $status: BookingStatus
  $addons: Any
  $specialRequests: String
) @auth(level: USER) {
  booking_update(
    key: { id: $id }
    data: {
      tourId: $tourId
      userId: $userId
      guests: $guests
      date: $date
      totalPrice: $totalPrice
      currency: $currency
      status: $status
      addons: $addons
      specialRequests: $specialRequests
    }
  )
}

# PUBLIC is required for self-signup (no session yet). The role is ALWAYS CUSTOMER here;
# privilege escalation (OPERATOR/ADMIN) must happen only via an authenticated admin Cloud Function.
mutation CreateUser(
  $email: String!
  $name: String!
  $description: String
) @auth(level: PUBLIC) {
  user_insert(data: {
    email: $email
    name: $name
    role: CUSTOMER
    description: $description
  })
}

# REMOVED: SetCurrentUser was unsafe — it upserted with hardcoded name/email and allowed
# any logged-in user to overwrite another user's record by id. The current user is fetched
# via the GetCurrentUser query (user(key: { id_expr: "auth.uid" })), which is the correct path.

