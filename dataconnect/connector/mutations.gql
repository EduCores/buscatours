mutation CreateTour(
  $title: String!
  $location: String!
  $duration: String!
  $durationHours: Int!
  $originalPrice: Float!
  $price: Float!
  $discount: String
  $category: Category!
  $description: String!
  $image: String!
  $featured: Boolean
  $oneDay: Boolean
  $popular: Boolean
  $status: TourStatus
  $destination: Destination!
  $vibeAdrenaline: Int
  $vibeRelax: Int
  $vibeCulture: Int
  $vibeFamily: Int
  $lat: Float
  $lng: Float
  $heroImages: String
  $heroBackgroundPosition: String
  $translations: String
  $operatorId: String!
  # Professional fields
  $availableDates: Any
  $itinerary: Any
  $minAge: Int
  $maxPassengers: Int
  $trailerUrl: String
  $galleryImages: Any
  $mapCenterLat: Float
  $mapCenterLng: Float
  $mapZoom: Int
  $difficulty: String
  $seasonality: Any
  $includes: Any
  $excludes: Any
  $requirements: Any
  $pickupInfo: String
  $cancellationPolicy: String
  $languages: Any
  $groupType: String
) @auth(level: USER) {
  tour_insert(data: {
    title: $title
    location: $location
    duration: $duration
    durationHours: $durationHours
    originalPrice: $originalPrice
    price: $price
    discount: $discount
    category: $category
    description: $description
    image: $image
    featured: $featured
    oneDay: $oneDay
    popular: $popular
    status: $status
    destination: $destination
    vibeAdrenaline: $vibeAdrenaline
    vibeRelax: $vibeRelax
    vibeCulture: $vibeCulture
    vibeFamily: $vibeFamily
    lat: $lat
    lng: $lng
    heroImages: $heroImages
    heroBackgroundPosition: $heroBackgroundPosition
    translations: $translations
    operatorId: $operatorId
    availableDates: $availableDates
    itinerary: $itinerary
    minAge: $minAge
    maxPassengers: $maxPassengers
    trailerUrl: $trailerUrl
    galleryImages: $galleryImages
    mapCenterLat: $mapCenterLat
    mapCenterLng: $mapCenterLng
    mapZoom: $mapZoom
    difficulty: $difficulty
    seasonality: $seasonality
    includes: $includes
    excludes: $excludes
    requirements: $requirements
    pickupInfo: $pickupInfo
    cancellationPolicy: $cancellationPolicy
    languages: $languages
    groupType: $groupType
  })
}

